name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "Pinging Supabase REST API at $(date -u)"
          STATUS=$(curl -s -o /tmp/body -w "%{http_code}" \
            --retry 3 --retry-delay 5 \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/")
          echo "HTTP status: ${STATUS}"
          cat /tmp/body 2>/dev/null; echo
          if [ "$STATUS" != "200" ]; then
            echo "::error::Supabase unreachable (HTTP ${STATUS})"
            exit 1
          fi
          echo "✅ Supabase alive — pause timer reset"

  recover:
    needs: ping
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Attempt auto-restore via Management API
        id: restore
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "${SUPABASE_PAT}" ] || [ -z "${SUPABASE_PROJECT_REF}" ]; then
            echo "⚠️ PAT/PROJECT_REF not set — skip auto-restore"
            echo "restored=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Restoring ${SUPABASE_PROJECT_REF}..."
          HTTP_CODE=$(curl -s -o /tmp/rb -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${SUPABASE_PAT}" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/restore")
          echo "HTTP ${HTTP_CODE}"
          cat /tmp/rb 2>/dev/null; echo
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "202" ]; then
            echo "✅ Restore submitted — project back in 1–3 min"
            echo "restored=ok" >> "$GITHUB_OUTPUT"
          elif [ "$HTTP_CODE" = "409" ]; then
            echo "⚠️ Already restoring or active"
            echo "restored=ok" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Restore API failed (HTTP ${HTTP_CODE})"
            echo "restored=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Open issue on restore failure
        if: steps.restore.outputs.restored == 'failed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DAY=$(date -u +%Y-%m-%d)
          gh issue create \
            --title "⚠️ Supabase 自動恢復失敗 — ${DAY}" \
            --label ops \
            --body "## ⚠️ Supabase 自動恢復失敗

          時間: $(date -u)

          事件: ${{ github.event_name }}

          Ping 失敗 → 自動 Restore API 也失敗。

          請手動處理：
          1. 前往 Supabase Dashboard 點 Restore project
          2. 等待 1–3 分鐘恢復
          3. 或到 GitHub Actions 手動觸發 workflow_dispatch 重新檢查"
