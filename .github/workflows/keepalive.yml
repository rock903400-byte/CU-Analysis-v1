name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (any endpoint = activity resets pause timer)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          echo "Pinging Supabase at $(date -u)"
          if [ -n "${SUPABASE_PROJECT_REF}" ] && [[ "${SUPABASE_URL}" != *"${SUPABASE_PROJECT_REF}"* ]]; then
            echo "::error::SUPABASE_URL 不含 PROJECT_REF（${SUPABASE_PROJECT_REF}），可能指向錯誤專案"
            exit 1
          fi
          STATUS=$(curl -s -o /tmp/body -w "%{http_code}" \
            --retry 3 --retry-delay 5 \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/" \
            || true)
          echo "HTTP status: ${STATUS:-<no response>}"
          if [ -z "$STATUS" ] || [ "$STATUS" = "000" ]; then
            echo "::error::Supabase DNS/connection error (${STATUS:-no response}) — may be paused"
            exit 1
          fi
          echo "✅ Supabase alive (HTTP ${STATUS}) — pause timer reset"

  recover:
    needs: ping
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Query project status via Management API
        id: status
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "${SUPABASE_PAT}" ] || [ -z "${SUPABASE_PROJECT_REF}" ]; then
            echo "⚠️ PAT/PROJECT_REF not set — skip auto-restore"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Querying status of ${SUPABASE_PROJECT_REF}..."
          BODY=$(curl -s \
            -H "Authorization: Bearer ${SUPABASE_PAT}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}" \
            || true)
          echo "$BODY"
          STATE=$(echo "$BODY" | grep -o '"status":"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "state=${STATE:-unknown}" >> "$GITHUB_OUTPUT"
          if [ "${STATE}" = "ACTIVE_HEALTHY" ]; then
            echo "✅ Project already active — no restore needed"
            echo "status=active" >> "$GITHUB_OUTPUT"
          elif [ "${STATE}" = "PAUSED" ]; then
            echo "⚠️ Project paused — will attempt restore"
            echo "status=paused" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Unknown status (${STATE:-empty}) — will attempt restore"
            echo "status=paused" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt auto-restore via Management API
        id: restore
        if: steps.status.outputs.status == 'paused'
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          echo "Restoring ${SUPABASE_PROJECT_REF}..."
          HTTP_CODE=$(curl -s -o /tmp/rb -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${SUPABASE_PAT}" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/restore" \
            || true)
          BODY=$(cat /tmp/rb 2>/dev/null)
          echo "HTTP ${HTTP_CODE}"
          [ -n "$BODY" ] && echo "$BODY"
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "202" ]; then
            echo "✅ Restore submitted — project back in 1–3 min"
            echo "restored=ok" >> "$GITHUB_OUTPUT"
          elif [ "$HTTP_CODE" = "409" ]; then
            echo "⚠️ Already restoring — treat as success"
            echo "restored=ok" >> "$GITHUB_OUTPUT"
          elif [ "$HTTP_CODE" = "400" ] && echo "$BODY" | grep -q "ACTIVE_HEALTHY"; then
            echo "⚠️ Project already active — no restore needed"
            echo "restored=ok" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Restore API failed (HTTP ${HTTP_CODE})"
            echo "restored=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Open issue on restore failure
        if: steps.restore.outputs.restored == 'failed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DAY=$(date -u +%Y-%m-%d)
          gh issue create \
            --title "⚠️ Supabase 自動恢復失敗 — ${DAY}" \
            --label ops \
            --body "## ⚠️ Supabase 自動恢復失敗

          時間: $(date -u)

          事件: ${{ github.event_name }}

          Ping 失敗 → Restore API 也失敗。

          請手動處理：
          1. 前往 Supabase Dashboard 點 Restore project
          2. 等待 1–3 分鐘恢復
          3. 或觸發 workflow_dispatch 重新檢查"
